<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura Al Arab | ساكورا العرب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;overflow:hidden}
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;
background:linear-gradient(to bottom,#0e5a3a 0%,#106844 35%,#2a7a5a 55%,#e8a0a8 82%,#f7c9d1 100%)}

/* زهور صغيرة مثل الفيديو - تنزل وتتمايل */
.petal-wrap{position:absolute;top:-30px;animation:fall linear infinite}
.petal{width:9px;height:9px;background:#ffc2d1;border-radius:50%;box-shadow:0 0 0 1px rgba(255,255,255,.4) inset;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(110vh)}}
@keyframes sway{from{transform:translateX(-18px) rotate(-20deg)}to{transform:translateX(18px) rotate(20deg)}}

.logo{width:min(52vw,210px);aspect-ratio:1;border-radius:50%;background:#fdf6e8;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:2;border:4px solid rgba(255,255,255,.9)}
.logo img{width:100%;height:100%;object-fit:cover}

.jp{margin-top:18px;color:#fff;font-size:22px;letter-spacing:4px;z-index:2}
.welcome{color:#fff;font-size:18px;font-weight:700;z-index:2}
.badge{display:inline-block;margin:10px 0;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.6);color:#fff;padding:5px 16px;border-radius:999px;font-size:12px;z-index:2}
h1{color:#fff;font-size:clamp(30px,8vw,44px);line-height:1.2;font-weight:900;text-shadow:0 2px 10px rgba(0,0,0,.3);z-index:2}
h1 span{display:block;font-size:.65em;font-weight:800}
.sub{color:#fff;opacity:.9;font-size:14px;margin:6px 0 18px;z-index:2}
.buttons{display:flex;flex-direction:column;gap:12px;width:min(88vw,320px);z-index:2}
.btn{font-size:17px;font-weight:800;padding:14px;border-radius:999px;text-decoration:none;text-align:center}
.btn-menu{background:#fff;color:#222}
.btn-profile{background:#c8283c;color:#fff}

/* جبل وجسر تحت مثل الفيديو */
.bottom-art{position:absolute;bottom:0;left:0;right:0;height:180px;z-index:1;pointer-events:none}
.bottom-art svg{width:100%;height:100%;display:block}
</style>
</head>
<body>
<div class="hero" id="hero">
  <div class="logo"><img src="logo.png" alt="Sakura Al Arab"></div>
  <div class="jp">ようこそ</div>
  <div class="welcome">أهلاً وسهلاً بكم</div>
  <div class="badge">✦ Saudi x Japanese ✦</div>
  <h1>ساكورا العرب <span>Sakura Al Arab</span></h1>
  <div class="sub">نكهة سعودية بروح يابانية</div>
  <div class="buttons">
    <a class="btn btn-menu" href="menu.html">🍜 قائمة الأطعمة</a>
    <a class="btn btn-profile" href="profile.html">👤 صفحتنا الشخصية</a>
  </div>
  <div class="bottom-art">
    <svg viewBox="0 0 400 180" preserveAspectRatio="none"><path d="M0 120 L120 40 L220 120 Z" fill="#2f3a3a"/><rect x="160" y="80" width="8" height="100" fill="#a83232"/><rect x="230" y="80" width="8" height="100" fill="#a83232"/><rect x="150" y="70" width="100" height="12" rx="6" fill="#c83232"/><rect x="150" y="100" width="100" height="10" rx="5" fill="#c83232"/></svg>
  </div>
</div>

<script>
// زهور صغيرة تتمايل مثل الفيديو بالضبط
const hero = document.getElementById('hero');
for(let i=0;i<22;i++){
  let wrap = document.createElement('div');
  wrap.className = 'petal-wrap';
  wrap.style.left = Math.random()*100 + '%';
  wrap.style.animationDuration = (6 + Math.random()*6) + 's';
  wrap.style.animationDelay = (Math.random()*6) + 's';
  let p = document.createElement('div');
  p.className = 'petal';
  p.style.animationDuration = (1.2 + Math.random()*1.2) + 's';
  p.style.opacity = 0.7 + Math.random()*0.3;
  let s = 6 + Math.random()*6;
  p.style.width = s + 'px'; p.style.height = s + 'px';
  wrap.appendChild(p);
  hero.appendChild(wrap);
}
</script>
</body>
</html>
