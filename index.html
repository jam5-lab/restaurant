<!doctype html>
<html lang="ar" dir="rtl">
<head>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sakura Al Arab · ساكورا العرب</title>
<style>
:root{--emerald:#123D32;--dark:#0B3027;--pink:#E7A1B2;--burg:#7C243C;--ivory:#F5EBDD;--wood:#806047;--gold:#C9A66B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0B3027;color:var(--ivory);font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.serif{font-family:Georgia,"Times New Roman",serif}

/* ---------- Layer A: photographic restaurant ---------- */
.scene{position:fixed;inset:0;overflow:hidden;background:#0B3027;pointer-events:none}
.par{position:absolute;inset:0;will-change:transform}
.zoom{position:absolute;inset:0;will-change:transform}
.kb{position:absolute;inset:0;animation:kb 30s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.07) translate3d(0,0,0)}to{transform:scale(1.14) translate3d(-1.2%,-.8%,0)}}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#sx{z-index:1;transition:opacity 1.3s ease 1.3s}
#si{z-index:2;opacity:0;transition:opacity 1.4s ease 1.1s}
#st{z-index:3;opacity:0;transition:opacity 1.2s ease .8s,height .9s cubic-bezier(.2,.8,.2,1)}
#sx .zoom{transition:transform 3s cubic-bezier(.55,0,.3,1)}
#si .zoom{transform:scale(1.35);transition:transform 3.4s cubic-bezier(.15,.7,.2,1)}
#st .zoom{transform:scale(1.12);transition:transform 2.6s cubic-bezier(.15,.7,.2,1) .6s}
body:not([data-s=intro]) #sx{opacity:0;pointer-events:none}
body:not([data-s=intro]) #sx .zoom{transform:scale(2.8)}
body[data-s=enter] #si,body[data-s=inside] #si{opacity:1}
body[data-s=enter] #si .zoom,body[data-s=inside] #si .zoom{transform:scale(1)}
body[data-s=table] #si{opacity:1;transition-delay:1.2s}
body[data-s=table] #si .zoom{transform:scale(1.9);transition-duration:1.8s}
body[data-s=table] #st{opacity:1}
body[data-s=table] #st .zoom{transform:scale(1)}
#shade{position:fixed;inset:0;z-index:4;pointer-events:none;transition:opacity 1s;background:
 linear-gradient(to top,rgba(11,48,39,.92) 0,rgba(11,48,39,.55) 30%,rgba(11,48,39,0) 58%),
 linear-gradient(to bottom,rgba(11,48,39,.55) 0,rgba(11,48,39,0) 20%)}
body[data-s=enter] #shade{opacity:.0}body[data-s=table] #shade{opacity:0}
#pet{position:fixed;inset:0;z-index:5;pointer-events:none;transition:opacity 1.2s}
body[data-s=table] #pet{opacity:0}

#w3{display:none;position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none}
body.w3 #w3{display:block}body.w3 .scene{display:none}body.w3 #pet{display:none}body.w3 #shade{opacity:.85}
body.w3 #hots,body.w3 #plates{position:fixed;inset:0;z-index:7;pointer-events:none}
body.w3 .slot{width:58px!important;height:58px!important;pointer-events:auto}body.w3 .slot .ph2{display:none}
body.w3[data-s=table] #shade{opacity:.35}
/* hotspot */
.hot{position:absolute;width:0;height:0;opacity:0;transition:opacity .8s .8s;pointer-events:none}
body[data-s=inside] .hot{opacity:1;pointer-events:auto}
#panHint{position:fixed;z-index:7;top:70px;left:50%;transform:translateX(-50%);opacity:0;transition:opacity .8s 1.5s;pointer-events:none;font-size:14px}body[data-s=inside] #panHint{opacity:1}
.hot button{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:2px solid #fff;background:rgba(245,235,221,.28);backdrop-filter:blur(3px);box-shadow:0 0 24px rgba(255,220,170,.55)}
.hot button::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(245,235,221,.55);animation:pulse 2.4s ease-out infinite}
.hot button i{position:absolute;inset:23px;border-radius:50%;background:var(--ivory)}
@keyframes pulse{from{transform:scale(.7);opacity:1}to{transform:scale(1.5);opacity:0}}
.hot span{position:absolute;left:0;transform:translate(-50%,0);top:38px;white-space:nowrap;font-size:15px;padding:4px 14px;border-radius:999px;background:rgba(11,48,39,.92);border:1px solid rgba(245,235,221,.5);box-shadow:0 4px 14px rgba(0,0,0,.5)}

/* ---------- UI chrome ---------- */
.fade{opacity:0;pointer-events:none;transition:opacity .9s}
#bar{position:fixed;z-index:9;top:max(12px,env(safe-area-inset-top));inset-inline:14px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.pill{display:inline-flex;align-items:center;gap:8px;padding:7px 15px;border-radius:999px;font-size:14px;background:rgba(11,48,39,.6);backdrop-filter:blur(8px);border:1px solid rgba(245,235,221,.28)}
#guestPill{display:none}
.btn{display:inline-block;border-radius:999px;padding:13px 38px;font-size:18px;background:var(--ivory);color:#2a1a12;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .25s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.55;cursor:wait}
.btn.rose{background:linear-gradient(135deg,#9a2e4d,var(--burg));color:var(--ivory)}
.btn.ghost{background:none;border:1px solid rgba(245,235,221,.45);color:var(--ivory);box-shadow:none}
.btn.sm{padding:9px 22px;font-size:15px}

#intro{position:fixed;z-index:6;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px calc(5vh + env(safe-area-inset-bottom));transition:opacity 1s;pointer-events:none}
body:not([data-s=intro]) #intro{opacity:0;visibility:hidden}
body.pre #intro{opacity:0;visibility:hidden}
#intro>*{pointer-events:auto}
.hot{z-index:7}#hots{position:absolute;inset:0}
#intro img{width:88px;height:88px;border-radius:50%;box-shadow:0 0 0 3px rgba(245,235,221,.85),0 10px 30px rgba(0,0,0,.5);margin-bottom:12px}
#intro .ja{color:var(--pink);letter-spacing:.35em;font-size:16px}
#intro h1{font-size:clamp(34px,7vw,56px);font-weight:700;margin:2px 0 0;text-shadow:0 3px 18px rgba(0,0,0,.6)}
#intro .en{color:var(--pink);font-size:19px;margin-bottom:6px}
#intro .tag{font-size:16px;opacity:.95;margin-bottom:10px}
#intro .concept{max-width:520px;font-size:15.5px;line-height:1.85;opacity:.9;margin-bottom:18px;text-shadow:0 2px 12px rgba(0,0,0,.7)}

#guest{position:fixed;z-index:8;left:50%;top:max(64px,8vh);transform:translate(-50%,30px);width:min(92vw,380px);text-align:center;padding:22px;border-radius:24px;background:rgba(11,48,39,.88);backdrop-filter:blur(14px);border:1px solid rgba(245,235,221,.22);box-shadow:0 20px 60px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .8s,transform .8s}
#guest.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#guest h3{font-size:20px;font-weight:600;margin-bottom:12px}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px;margin:6px 0 16px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(245,235,221,.5);font-size:24px}
.stepper b{font-size:34px;min-width:44px;font-weight:600}

/* ---------- Layer B: clean menu interface ---------- */
#menu{position:fixed;z-index:8;left:0;right:0;bottom:0;height:52%;padding:16px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#123D32,#0B3027);border-radius:26px 26px 0 0;box-shadow:0 -18px 50px rgba(0,0,0,.45);transform:translateY(105%);transition:transform .9s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;touch-action:pan-y}
body[data-s=table] #menu{transform:none;transition-delay:1.5s}
@media (orientation:portrait){body[data-s=table] #st{height:50%}}
@media (min-width:900px){#menu{left:auto;right:auto;inset-inline-end:3vw;top:4vh;bottom:4vh;width:470px;height:auto;border-radius:26px;transform:translateX(120%)}[dir=rtl] #menu{transform:translateX(-120%)}body[data-s=table] #menu{transform:none}}
#menu .alg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;margin-bottom:10px}
#menu .alg em{font-style:normal;opacity:.7}
.lan{position:relative;display:flex;justify-content:space-around;align-items:flex-start;padding-top:2px;margin-bottom:6px}
.lan::before{content:"";position:absolute;top:0;left:3%;right:3%;height:2px;background:linear-gradient(90deg,transparent,#C9A66B,transparent);opacity:.8}
.lt{display:flex;flex-direction:column;align-items:center;gap:2px;width:25%;transform-origin:50% 0;animation:sway 4.5s ease-in-out infinite alternate;animation-delay:var(--d,0s);--c:#cdbfa6;--g:transparent}
.lt svg{width:34px;height:52px;overflow:visible;transition:filter .6s}
.lt .paper{fill:var(--c);transition:fill .6s}
.lt.amber{--c:#f2b44a;--g:rgba(255,176,60,.9)}.lt.red{--c:#e5483d;--g:rgba(255,70,50,.95)}
.lt.amber svg,.lt.red svg{filter:drop-shadow(0 0 9px var(--g)) drop-shadow(0 0 20px var(--g))}
.lt:not(.amber):not(.red) svg{opacity:.55}
.lt span{font-size:12.5px;line-height:1.2;text-align:center;border-radius:999px;padding:1px 8px;border:1px solid transparent}
.lt.av span{border-color:var(--pink);color:var(--pink)}
.lt.big svg{width:42px;height:64px}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.legend{font-size:12px;opacity:.75;text-align:center;margin-bottom:6px;display:flex;gap:14px;justify-content:center}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
@media (orientation:portrait){#menu .short{display:none}.legend{display:none}}
/* deconstruct */
.dec .dbtn{display:block;margin:6px auto 0}
.dec .dh{margin-top:14px;border-radius:16px;overflow:hidden;transition:transform .9s cubic-bezier(.2,.8,.2,1),filter .9s,box-shadow .9s;box-shadow:0 10px 26px rgba(0,0,0,.4)}
.dec .dh img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
.dec.open .dh{transform:scale(.94);filter:brightness(.7)}
.dec .dl{display:grid;grid-template-rows:0fr;transition:grid-template-rows 1s cubic-bezier(.2,.8,.2,1)}
.dec.open .dl{grid-template-rows:1fr}
.dec .dl>div{overflow:hidden;min-height:0}
.dec .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-top:16px}
.dec figure{margin:0;opacity:0;transform:translateY(-90px) scale(.85);transition:opacity .7s,transform .9s cubic-bezier(.2,.9,.2,1)}
.dec.open figure{opacity:1;transform:none;transition-delay:calc(var(--i)*.13s + .15s)}
.dec:not(.open) figure{transition-delay:calc((4 - var(--i))*.05s)}
.dec .ph{overflow:hidden;border-radius:14px;aspect-ratio:1/1;box-shadow:0 12px 28px rgba(0,0,0,.4)}
.dec .ph img{width:100%;height:100%;object-fit:cover}
.dec figcaption{font-size:15px;line-height:1.5;margin-top:8px}
.dec figcaption small{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);margin-bottom:2px}
.dec .lines{margin-top:12px}
.chip{padding:3px 12px;border-radius:999px;border:1px solid rgba(245,235,221,.35);font-size:13px}
.chip.on{background:var(--pink);color:#3a1220;border-color:var(--pink)}
.mhero{position:relative;flex:1;min-height:110px;border-radius:18px;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.45);cursor:pointer}
.mhero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s,opacity .5s}
.mhero:hover img{transform:scale(1.04)}
.badge{position:absolute;top:10px;inset-inline-start:10px;padding:4px 12px;border-radius:999px;font-size:13px;background:rgba(124,36,60,.92)}
.badge.may{background:rgba(160,112,40,.92)}
.mrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:12px}
.mrow h2{font-size:22px;font-weight:700;line-height:1.3}
.mrow .price{font-size:20px;color:var(--gold);white-space:nowrap}
.men{color:var(--pink);font-size:15px}
.short{font-size:14px;opacity:.82;margin-top:4px;line-height:1.6;max-height:3.2em;overflow:hidden}
.mact{display:flex;gap:10px;align-items:center;margin-top:12px}
.mact .btn{flex:1;text-align:center;padding:12px 10px;font-size:16px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:10px}
.dots i{width:8px;height:8px;border-radius:50%;background:rgba(245,235,221,.3);transition:.3s}.dots i.on{background:var(--pink);width:22px;border-radius:5px}
.nav{position:absolute;top:50%;width:40px;height:40px;border-radius:50%;background:rgba(11,48,39,.7);border:1px solid rgba(245,235,221,.4);font-size:20px;transform:translateY(-50%);z-index:2}

#cartBar{position:fixed;z-index:10;left:50%;transform:translate(-50%,30px);bottom:calc(12px + env(safe-area-inset-bottom));transition:transform .6s,opacity .6s;opacity:0;pointer-events:none}
#cartBar.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
@media (orientation:portrait){#cartBar{bottom:auto;top:62px}}#cartBar .btn{white-space:nowrap;font-size:15px;padding:10px 22px}

.plates{position:absolute;inset:0}
.slot{pointer-events:auto;position:absolute;transform:translate(-50%,-50%);display:grid;place-items:center;cursor:pointer;transition:opacity .6s}
.slot .ring{position:absolute;inset:0;border:1.5px dashed rgba(245,235,221,.85);border-radius:50%;background:rgba(11,48,39,.28);backdrop-filter:blur(1.5px);animation:pulse2 2.6s ease-in-out infinite}
.slot .pl{position:absolute;color:#fff;font-size:22px;text-shadow:0 2px 8px #000}
.slot .ph2{position:absolute;inset:0;border-radius:50%;background-size:var(--bs,150%);background-position:center;-webkit-mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);mask-image:radial-gradient(closest-side,#000 72%,transparent 100%);opacity:0;transform:translateY(-40px) scale(1.15);transition:opacity .8s,transform .9s cubic-bezier(.2,.9,.2,1);filter:saturate(1.05) contrast(1.04) drop-shadow(0 10px 8px rgba(0,0,0,.5))}
.slot.full .ph2{opacity:1;transform:none}.slot.full .ring,.slot.full .pl{display:none}
.slot .q{position:absolute;bottom:2px;right:2px;min-width:24px;height:24px;border-radius:12px;background:var(--burg);font-size:13px;display:none;place-items:center;padding:0 6px;border:1px solid var(--ivory)}
.slot.full .q{display:grid}.slot.sel .ring{border-color:var(--pink);border-style:solid}
@keyframes pulse2{50%{opacity:.55}}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(5,22,17,.72);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.panel{position:relative;width:min(720px,100%);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#123D32,#0B3027);border-radius:26px 26px 0 0;padding:0 0 34px;box-shadow:0 -20px 60px rgba(0,0,0,.55);animation:up .55s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.panel .x{position:absolute;top:14px;inset-inline-end:14px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(11,48,39,.75);backdrop-filter:blur(6px);font-size:22px;border:1px solid rgba(245,235,221,.35)}
.panel .pad{padding:0 22px}
.dph{position:relative;aspect-ratio:3/2.1;overflow:hidden;border-radius:26px 26px 0 0}
.dph img{width:100%;height:100%;object-fit:cover;animation:kb2 20s ease-in-out infinite alternate}
@keyframes kb2{from{transform:scale(1)}to{transform:scale(1.08)}}
.dph::after{content:"";position:absolute;inset:auto 0 0 0;height:35%;background:linear-gradient(to top,#123D32,transparent)}
.dn{margin-top:4px}.dn h2{font-size:28px;font-weight:700}
.dprice{font-size:22px;color:var(--gold);margin:6px 0 4px}
h4{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin:26px 0 12px;font-weight:600}
.lead{font-size:15.5px;line-height:1.9;opacity:.9}

/* editorial ingredients */
.eg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.eg figure{margin:0;opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}
.eg figure.in{opacity:1;transform:none}
.eg .ph{overflow:hidden;border-radius:14px;aspect-ratio:1/1;box-shadow:0 12px 28px rgba(0,0,0,.4)}
.eg .ph img{width:100%;height:100%;object-fit:cover;animation:kb2 14s ease-in-out infinite alternate}
.eg figcaption{font-size:15px;line-height:1.5;margin-top:8px}
.eg figcaption small{display:block;font-size:12px;letter-spacing:.14em;color:var(--gold);margin-bottom:2px}
.lines{margin-top:14px;border-top:1px solid rgba(245,235,221,.16)}
.lines div{padding:11px 2px;border-bottom:1px solid rgba(245,235,221,.16);font-size:15.5px;display:flex;gap:10px;align-items:baseline}
.lines div::before{content:"✿";color:var(--pink);font-size:12px}
.algbox{border:1px solid rgba(245,235,221,.22);border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.75;background:rgba(0,0,0,.14)}
.algbox b{color:var(--pink)}
.qty{display:flex;align-items:center;gap:14px;margin-top:22px}
.qty .r{width:42px;height:42px;border-radius:50%;border:1px solid rgba(245,235,221,.5);font-size:22px}
.qty span{font-size:22px;min-width:24px;text-align:center}
.qty .btn{flex:1;text-align:center;padding:13px 10px;font-size:17px}

/* bill */
.bill{padding:26px 22px 0}
.bill h2{font-size:28px;margin-bottom:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid rgba(245,235,221,.14);font-size:16px}
.row .nm{display:flex;align-items:center;gap:10px;min-width:0}
.row img{width:46px;height:46px;border-radius:10px;object-fit:cover;flex:none}
.mini{display:inline-flex;align-items:center;gap:8px}.mini button{width:28px;height:28px;border-radius:50%;border:1px solid rgba(245,235,221,.5)}
.sum{display:flex;justify-content:space-between;padding:7px 0;opacity:.85}
.tot{display:flex;justify-content:space-between;padding:12px 0;font-size:22px;font-weight:700;border-top:1px solid rgba(201,166,107,.6);margin-top:6px}
.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;padding:10px 4px;border-radius:12px;border:1px solid rgba(245,235,221,.3);font-size:14px;text-align:center}.tab.on{background:var(--ivory);color:#2a1a12}
input.t,select.t{background:rgba(0,0,0,.2);border:1px solid rgba(245,235,221,.3);color:var(--ivory);border-radius:10px;padding:8px 10px;font:inherit;font-size:15px;min-width:0}
input.t.n{width:90px;text-align:center}
.ok{color:#9ad9b0}.bad{color:#ff9aa8}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1;text-align:center;padding:13px 6px;font-size:16px}
.empty{padding:70px 24px;text-align:center;opacity:.8;font-size:18px}
.done{padding:50px 24px;text-align:center}.done h2{font-size:26px;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){.kb,.dph img,.eg .ph img{animation:none}}
.stagewrap{position:relative;max-width:420px;margin:6px auto 0;aspect-ratio:420/560}
.stage{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.labels{position:absolute;inset:0;pointer-events:none}
.lab{position:absolute;left:59.5%;width:40.5%;transform:translateY(-50%);pointer-events:auto;cursor:pointer;line-height:1.35;padding:4px 0;direction:rtl;text-align:right;transition:opacity .3s}
.lab b{display:block;font-weight:600;font-size:15px}.lab i{display:block;font-family:Georgia,serif;color:var(--pink);font-size:13.5px}
.lab.dim{opacity:.3}
.ctrl{display:flex;align-items:center;gap:14px;max-width:420px;margin:4px auto 0}
.ctrl .btn{padding:8px 18px;font-size:15px;white-space:nowrap}.ctrl input{flex:1;accent-color:var(--pink);min-width:0}
.dec2{margin-top:6px}
#cine i{position:fixed;left:0;right:0;height:0;background:#000;z-index:30;pointer-events:none;transition:height 1.4s cubic-bezier(.3,.7,.2,1)}#cine i:first-child{top:0}#cine i:last-child{bottom:0}body.cine #cine i{height:11vh}

#menu{height:auto;max-height:68%;overflow-y:auto;overscroll-behavior:contain}
.cats-h{text-align:center;margin:2px 0 12px}.cats-h h2{font-size:24px;font-weight:700}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cat{position:relative;border-radius:20px;padding:18px 10px 14px;border:1px solid rgba(201,166,107,.55);color:var(--ivory);text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center;overflow:hidden;
 background:radial-gradient(circle at 50% 0%,rgba(231,161,178,.22),transparent 62%),linear-gradient(160deg,#17493b,#0d3329);box-shadow:0 10px 24px rgba(0,0,0,.35);transition:transform .25s,border-color .25s}

const CATS=[{id:'breakfast',ar:'فطور',en:'Breakfast',jp:'朝食'},{id:'lunch',ar:'غداء',en:'Lunch',jp:'昼食'},{id:'dinner',ar:'عشاء',en:'Dinner',jp:'夕食'},{id:'drinks',ar:'مشروبات',en:'Drinks',jp:'飲み物'}];
let cat=null,selIng=-1;
const inCat=c=>DISHES.map((d,i)=>d.cats.includes(c)?i:-1).filter(i=>i>=0);
function renderMenu(){updateSlots();const M=$('menu'),ar=lang==='ar';
 if(cat===null){
  M.innerHTML=`<div class="cats-h"><h2>${ar?'ماذا تشتهون؟':'What are you craving?'}</h2><div class="men serif" ${ar?'':'dir="rtl"'}>${ar?'اختاروا القسم':'Choose a section'}</div></div>
  <div class="cats">${CATS.map(c=>{const n=inCat(c.id).length;return `<button class="cat ${n?'':'soon'}" data-c="${c.id}"><span class="cj">${c.jp}</span><b>${ar?c.ar:c.en}</b><small>${n?n+' '+(ar?(n===1?'صنف':'أصناف'):(n===1?'dish':'dishes')):(ar?'قيد الإعداد':'In preparation')}</small></button>`}).join('')}</div>`;
  M.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.c;const l=inCat(cat);if(l.length)idx=l[0];selIng=-1;chime(587,1.2);renderMenu()});
  updateCart();return}
 const list=inCat(cat),tabs=`<div class="ctabs"><button class="back" id="mback">${ar?'›':'‹'} ${ar?'الأقسام':'Sections'}</button>${CATS.map(c=>`<button class="ctab ${c.id===cat?'on':''}" data-c="${c.id}">${ar?c.ar:c.en}</button>`).join('')}</div>`;
 const bind=()=>{$('mback').onclick=()=>{cat=null;chime(523,1);renderMenu()};M.querySelectorAll('.ctab').forEach(b=>b.onclick=()=>{cat=b.dataset.c;const l=inCat(cat);if(l.length)idx=l[0];selIng=-1;chime(587,1);renderMenu()})};
 if(!list.length){M.innerHTML=tabs+`<div class="empty">${ar?'قائمة هذا القسم قيد الإعداد — لم تصلنا بعد أصناف مؤكدة له.':'This section is being prepared — no confirmed dishes yet.'}</div>`;bind();updateCart();return}
 if(!list.includes(idx))idx=list[0];
 const d=DISHES[idx],ing=ar?d.ingAr:d.ingEn,r=risk(d),n=ing.length;
 const sats=ing.map((x,i)=>`<button class="sat ${selIng===i?'on':''}" data-i="${i}" style="--a:${(-90+i*360/n).toFixed(1)}deg" aria-label="${x}"><span class="sin"><span class="si">${d.ph&&d.ph[i]?`<img src="${d.ph[i]}" alt="">`:'<i>✿</i>'}</span></span></button>`).join('');
 M.innerHTML=`${tabs}
 <div class="orb ${selIng>=0?'hold':''}" id="orb"><div class="ring"></div><div class="swrap">${sats}</div><button class="plate" id="mh" aria-label="${dn(d)}"><img src="${d.img}" alt="${d.en}"></button>${list.length>1?`<button class="nav" id="pv" style="inset-inline-start:0">${ar?'›':'‹'}</button><button class="nav" id="nx" style="inset-inline-end:0">${ar?'‹':'›'}</button>`:''}</div>
 <div class="cap" id="cap">${selIng>=0?`<b>${String(selIng+1).padStart(2,'0')}</b> ${ing[selIng]}`:(ar?'المس مكوّناً لتعرفه · المس الطبق لتفكيكه':'Tap an ingredient · tap the plate to take it apart')}</div>
 <div class="mrow"><div><h2>${dn(d)}</h2><div class="men serif" ${ar?'':'dir="rtl"'}>${dn2(d)}</div></div><div class="ptag">${fmt(d.price*100)}</div></div>
 ${lanternsHTML(d)}
 ${d.contains.length||d.may.length?`<div class="short">${d.contains.length?t('contains')+': '+d.contains.map(a=>ALGS[a][lang]).join('، '):''}${d.contains.length&&d.may.length?' · ':''}${d.may.length?t('may')+': '+d.may.map(a=>ALGS[a][lang]).join('، '):''}</div>`:''}
 <div class="mact"><button class="btn ghost" id="mdet">${t('details')}</button><button class="btn rose" id="madd">${t('add')}</button></div>`;
 bind();bindLan(M);
 const go=k=>{const p=list.indexOf(idx);idx=list[(p+k+list.length)%list.length];selIng=-1;chime([523,587,659][idx%3]);renderMenu()};
 if($('pv')){$('pv').onclick=e=>{e.stopPropagation();go(ar?1:-1)};$('nx').onclick=e=>{e.stopPropagation();go(ar?-1:1)}}
 M.querySelectorAll('.sat').forEach(b=>b.onclick=e=>{e.stopPropagation();selIng=+b.dataset.i;chime(660+selIng*60,.8);M.querySelectorAll('.sat').forEach(x=>x.classList.toggle('on',x===b));$('orb').classList.add('hold');$('cap').innerHTML=`<b>${String(selIng+1).padStart(2,'0')}</b> ${ing[selIng]}`});
 $('mh').onclick=$('mdet').onclick=()=>openDetail(d);$('madd').onclick=()=>addDish(d,1);
 let x0=null;M.onpointerdown=e=>x0=e.clientX;M.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(list.length>1&&Math.abs(dx)>60&&!e.target.closest('button'))go(dx<0?(ar?-1:1):(ar?1:-1))};
 updateCart()}
function addDish(d,q){cart[d.id]=(cart[d.id]||0)+q;chime(880,1.5);updateCart();const b=$('madd');if(b){b.textContent='✓';setTimeout(()=>b&&(b.textContent=t('add')),900)}}
function updateCart(){updateSlots();const b=$('openBill');b.textContent=cnt()?`${t('bill')} · ${cnt()} ${t('items')} · ${fmt(totalH())}`:t('bill');$('cartBar').classList.toggle('show',state==='table'&&cnt()>0)}
$('openBill').onclick=()=>{chime(740,1.4);renderBill()};

/* dish detail — large photo + editorial ingredients */
let openD=null;
function openDetail(d){openD=d;let q=1;const ing=lang==='ar'?d.ingAr:d.ingEn,r=risk(d),P=$('dPanel');
 const figs=d.ph.map((f,i)=>f?`<figure style="--i:${i}"><div class="ph"><img src="${f}" alt="" loading="lazy"></div><figcaption><small>${String(i+1).padStart(2,'0')}</small>${ing[i]}</figcaption></figure>`:'').join('');
 const lines=d.ph.map((f,i)=>f?'':`<div>${ing[i]}</div>`).join('');
 P.innerHTML=`<button class="x" id="dx" aria-label="close">×</button><div class="dph"><img src="${d.img}" alt="${d.en}"></div>
 <div class="pad"><div class="dn"><h2>${dn(d)}</h2><div class="men serif" ${lang==='ar'?'':'dir="rtl"'}>${dn2(d)}</div></div><div class="dprice">${fmt(d.price*100)}</div>
 ${lanternsHTML(d,true)}${legendHTML().replace('class="legend"','class="legend" style="display:flex"')}
 <h4>${t('ing')}</h4><div class="dec2">${stageHTML(d,lang==='ar')}</div>
 <h4>${t('alg')}</h4><div class="algbox">${lang==='ar'?d.alAr:d.alEn}</div>
 <div class="qty"><button class="r" id="qm">−</button><span id="qv">1</span><button class="r" id="qp">+</button><button class="btn rose" id="qa">${t('add')} · <b id="qs">${fmt(d.price*100)}</b></button></div></div>`;
 $('dSheet').classList.add('show');chime(587,1.2);wireStage(P,d);if(W3&&state==='table'){try{W3.liftDome(selTable,DISHES.indexOf(d),true)}catch(e){}}
 const up=()=>{$('qv').textContent=q;$('qs').textContent=fmt(d.price*q*100)};
 $('dx').onclick=closeD;$('qm').onclick=()=>{q=Math.max(1,q-1);up()};$('qp').onclick=()=>{q=Math.min(20,q+1);up()};
 $('qa').onclick=()=>{addDish(d,q);closeD()};
 bindLan(P);}
function closeD(){if(W3&&openD&&state==='table'){try{W3.liftDome(selTable,DISHES.indexOf(openD),false)}catch(e){}}$('dSheet').classList.remove('show');openD=null}
$('dSheet').onclick=e=>{if(e.target===$('dSheet'))closeD()};$('bSheet').onclick=e=>{if(e.target===$('bSheet'))$('bSheet').classList.remove('show')};

/* ===================== bill — integer halalas, VAT 15% ===================== */
const pname=i=>names[i].trim()||`${t('guest')} ${i+1}`;
function distribute(total,w){const W=w.reduce((a,b)=>a+b,0);if(!W)return w.map(()=>0);const raw=w.map(x=>total*x/W),base=raw.map(Math.floor);let left=total-base.reduce((a,b)=>a+b,0);raw.map((r,i)=>[r-Math.floor(r),i]).sort((a,b)=>b[0]-a[0]).forEach(([,i])=>{if(left>0){base[i]++;left--}});return base}
const units=()=>{const u=[];DISHES.forEach(d=>{for(let k=0;k<(cart[d.id]||0);k++)u.push({key:d.id+'#'+k,d})});return u};
function shares(){const tot=totalH(),ones=Array(guests).fill(1);
 if(mode==='equal')return distribute(tot,ones);
 if(mode==='dish'){const out=Array(guests).fill(0);let pool=0;units().forEach(u=>{const p=assign[u.key],c=u.d.price*115;if(p!==undefined&&p<guests)out[p]+=c;else pool+=c});distribute(pool,ones).forEach((v,i)=>out[i]+=v);return out}
 return Array.from({length:guests},(_,i)=>custom[i]||0)}
function renderBill(){const P=$('bPanel'),S=$('bSheet');S.classList.add('show');
 if(!cnt()){P.innerHTML=`<button class="x" id="bx2">×</button><div class="empty">${t('empty')}</div>`;$('bx2').onclick=()=>S.classList.remove('show');return}
 const s=sub(),v=vatOf(s),tot=s+v,sh=shares(),sum=sh.reduce((a,b)=>a+b,0),diff=tot-sum;
 P.innerHTML=`<button class="x" id="bx2">×</button><div class="bill"><h2>${t('bill')}</h2>
 ${DISHES.filter(d=>cart[d.id]).map(d=>`<div class="row"><span class="nm"><img src="${d.img}" alt=""><span>${dn(d)}</span></span><span class="mini"><button data-m="${d.id}">−</button><b>${cart[d.id]}</b><button data-p="${d.id}">+</button></span><span>${fmt(d.price*cart[d.id]*100)}</span></div>`).join('')}
 <div class="sum" style="margin-top:8px"><span>${t('sub')}</span><span>${fmt(s)}</span></div><div class="sum"><span>${t('vat')}</span><span>${fmt(v)}</span></div>
 <div class="tot"><span>${t('total')}</span><b>${fmt(tot)}</b></div>
 <h4>${t('people')}</h4><div class="stepper" style="justify-content:flex-start;margin:0"><button id="bm">−</button><b>${guests}</b><button id="bp">+</button></div>
 <div class="tabs">${[['equal','equal'],['dish','byDish'],['custom','custom']].map(([m,k])=>`<button class="tab ${mode===m?'on':''}" data-mode="${m}">${t(k)}</button>`).join('')}</div><div id="mdv"></div>
 <h4>${t('shares')}</h4>${sh.map((x,i)=>`<div class="row"><input class="t" data-name="${i}" placeholder="${pname(i)}" value="${names[i].replace(/"/g,'&quot;')}"><b>${fmt(x)}</b></div>`).join('')}
 <div class="tot" style="font-size:16px;border-top:1px solid rgba(245,235,221,.2)"><span class="${diff?'bad':'ok'}">${diff?t('off')+': '+fmt(diff):'✓ '+t('rec')}</span><b>${fmt(sum)}</b></div>
 <div class="acts"><button class="btn ghost" id="b0">${t('back')}</button><button class="btn rose" id="b1" ${diff?'disabled style="opacity:.5"':''}>${t('confirm')}</button></div></div>`;
 const md=$('mdv');
 if(mode==='dish')md.innerHTML=`<h4>${t('who')}</h4>`+units().map(u=>`<div class="row"><span>${dn(u.d)}</span><select class="t" data-u="${u.key}"><option value="">${t('un')}</option>${Array.from({length:guests},(_,i)=>`<option value="${i}" ${assign[u.key]===i?'selected':''}>${pname(i)}</option>`).join('')}</select></div>`).join('');
 if(mode==='custom')md.innerHTML=Array.from({length:guests},(_,i)=>`<div class="row"><span>${pname(i)}</span><span><input class="t n" type="number" min="0" step="0.5" inputmode="decimal" data-c="${i}" value="${(custom[i]||0)/100||''}" placeholder="0"> ${t('sar')}</span></div>`).join('');
 $('bx2').onclick=$('b0').onclick=()=>S.classList.remove('show');
 $('b1').onclick=()=>{chime(784,2);P.innerHTML=`<button class="x" id="bx3">×</button><div class="done"><h2>${t('thanks')}</h2><p class="lead">${t('thx2')}</p></div>`;$('bx3').onclick=()=>S.classList.remove('show');cart={};updateCart()};
 P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const k=b.dataset.m;cart[k]=Math.max(0,cart[k]-1);if(!cart[k])delete cart[k];updateCart();renderBill()});
 P.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const k=b.dataset.p;cart[k]=Math.min(30,cart[k]+1);updateCart();renderBill()});
 $('bm').onclick=()=>setG(guests-1);$('bp').onclick=()=>setG(guests+1);
 P.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;if(mode==='custom'){custom=Array(MAXG).fill(0);distribute(tot,Array(guests).fill(1)).forEach((x,i)=>custom[i]=x)}renderBill()});
 P.querySelectorAll('[data-name]').forEach(i=>i.onchange=()=>{names[+i.dataset.name]=i.value;renderBill()});
 P.querySelectorAll('[data-u]').forEach(s=>s.onchange=()=>{s.value===''?delete assign[s.dataset.u]:assign[s.dataset.u]=+s.value;renderBill()});
 P.querySelectorAll('[data-c]').forEach(i=>i.onchange=()=>{custom[+i.dataset.c]=Math.round((+i.value||0)*100);renderBill()})}
function setG(n){guests=Math.min(MAXG,Math.max(1,n));$('guestPill').textContent=`${t('tbl')} ${selTable+1} · 👥 ${guests}`;$('gv').textContent=guests;renderBill()}

/* ===================== boot ===================== */
async function tryWorld(){if(/photo/.test(location.search))return;try{const to=new Promise((_,j)=>setTimeout(()=>j(new Error('3D load timeout')),12000));const m=await Promise.race([import('./assets/world.js'),to]);W3=await Promise.race([m.createWorld($('w3')),to]);hotsHome=$('hots').parentNode;document.body.appendChild($('hots'));document.body.appendChild($('plates'));B.classList.add('w3')}catch(e){console.warn('3D world unavailable, using photo scenes',e);W3=null}}
async function boot(){applyLang();$('enter').disabled=true;await tryWorld();if(W3){B.classList.add('pre');(async()=>{await wait(3800);try{await W3.fly('front',4.2)}catch(e){}B.classList.remove('pre');$('enter').disabled=false})()}else $('enter').disabled=false;if(!W3){depthScene($('bx'),'assets/env/exterior_d.png',()=>PHOTO.x.pos,()=>state==='intro'||state==='enter');GI=depthScene($('bi'),'assets/env/interior_d.png',()=>PHOTO.i.pos,()=>state==='enter'||state==='inside'||state==='table');GT=depthScene($('bt'),'assets/env/table_d.png',()=>[.5,.72],()=>state==='table')}
 buildSlots();layout();sizeC();addEventListener('resize',sizeC);applyLang();updateCart();requestAnimationFrame(petalLoop);
 setTimeout(()=>{['snd','lang'].forEach(i=>$(i).classList.remove('fade'))},300)}
Promise.all(['bx','bi','bt'].map(i=>new Promise(r=>{const im=$(i);im.complete?r():(im.onload=im.onerror=r)}))).then(boot);
</script>
</body>
</html>
