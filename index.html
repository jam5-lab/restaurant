<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura Al Arab | ساكورا العرب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tajawal,sans-serif;overflow:hidden}
.hero{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}

/* تساقط ساكورا مثل الفيديو - تنزل وتتمايل */
.petal-wrap{position:absolute;top:-30px;z-index:2;animation:fall linear infinite;pointer-events:none}
.petal{width:9px;height:12px;background:#ffc2d1;border-radius:80% 0 80% 0;opacity:.9;animation:sway ease-in-out infinite alternate}
@keyframes fall{to{transform:translateY(110vh)}}
@keyframes sway{from{transform:translateX(-18px) rotate(-25deg)}to{transform:translateX(18px) rotate(25deg)}}

/* الأزرار بس، في منطقة الماء الفاضية */
.buttons{position:absolute;left:0;right:0;bottom:16%;z-index:3;display:flex;flex-direction:column;gap:12px;align-items:center;padding:0 20px}
.btn{width:min(88vw,320px);font-size:17px;font-weight:800;padding:14px;border-radius:999px;text-decoration:none;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.btn-menu{background:#fff;color:#222}
.btn-profile{background:#c8283c;color:#fff;border:2px solid rgba(255,255,255,.9)}
</style>
</head>
<body>
<div class="hero" id="hero">
  <img class="bg" src="facade.jpg" alt="Sakura Al Arab">
  <div class="buttons">
    <a class="btn btn-menu" href="menu.html">🍜 قائمة الأطعمة</a>
    <a class="btn btn-profile" href="profile.html">👤 صفحتنا الشخصية</a>
  </div>
</div>

<script>
// بتلات صغيرة مثل الفيديو
const hero = document.getElementById('hero');
for(let i=0;i<24;i++){
  let wrap = document.createElement('div');
  wrap.className = 'petal-wrap';
  wrap.style.left = Math.random()*100 + '%';
  wrap.style.animationDuration = (6 + Math.random()*6) + 's';
  wrap.style.animationDelay = (Math.random()*6) + 's';
  let p = document.createElement('div');
  p.className = 'petal';
  p.style.animationDuration = (1.1 + Math.random()*1.3) + 's';
  let s = 7 + Math.random()*7;
  p.style.width = s + 'px';
  p.style.height = (s+3) + 'px';
  p.style.background = Math.random()>0.5 ? '#ffc2d1' : '#ffd7e8';
  wrap.appendChild(p);
  hero.appendChild(wrap);
}
</script>
</body>
</html>
